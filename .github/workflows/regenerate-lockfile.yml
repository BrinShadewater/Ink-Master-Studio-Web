name: Regenerate lockfile

# TEMPORARY. Delete this workflow once the lockfile is fixed.
#
# npm prunes optional dependencies to the host platform when it writes a
# lockfile, so a lockfile generated on Windows omits the Linux-only packages
# @rolldown/binding-wasm32-wasi needs (@emnapi/core, @emnapi/runtime). That
# makes `npm ci` fail on Ubuntu CI. This job regenerates the lockfile on Linux
# and uploads it, so a correct one can be committed from any machine.

on:
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile from package.json
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --no-audit --no-fund
      - name: Show what resolved
        run: |
          echo "--- emnapi entries ---"
          grep -c '"node_modules/@emnapi/core"' package-lock.json || true
          grep -c '"node_modules/@emnapi/runtime"' package-lock.json || true
          grep -c '"node_modules/@emnapi/wasi-threads"' package-lock.json || true
      - name: Prove npm ci accepts it
        run: npm ci --no-audit --no-fund
      - name: Prove the suite passes against it
        run: npm test
      - name: Upload the lockfile
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 1
